# SECRET DATA IS NOT EXPORTED. Recreate manually or via Vault/External Secrets Operator.
# This file lists only the names and types of secrets that must exist.
- - annotations:
      cert-manager.io/allow-direct-injection: 'true'
    labels:
      app.kubernetes.io/managed-by: cert-manager-webhook
    name: cert-manager-webhook-ca
    namespace: cert-manager
  - Opaque
- - name: ofam-ca-secret
    namespace: cert-manager
  - kubernetes.io/tls
