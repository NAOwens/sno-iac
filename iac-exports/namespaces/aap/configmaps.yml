  data:
    nginx.conf: "# Note: Keep this file in sync with https://github.com/ansible/aap-gateway/blob/devel/tools/configs/nginx-gateway.conf\nworker_processes
      auto;\npid /tmp/nginx.pid;\nerror_log  /dev/stdout error;\n\n# Load dynamic
      modules. See /usr/share/doc/nginx/README.dynamic.\ninclude /usr/share/nginx/modules/*.conf;\n\nevents
      {\n    worker_connections 1024;\n}\n\nhttp {\n    log_format  main  '$remote_addr
      - $remote_user [$time_local] \"$request\" '\n                    '$status $body_bytes_sent
      ($request_time) \"$http_referer\" '\n                    '\"$http_user_agent\"
      \"$http_x_forwarded_for\" request-id: \"$http_x_request_id\"';\n\n    access_log
      \ /dev/stdout  main;\n\n    sendfile            on;\n    tcp_nopush          on;\n
      \   tcp_nodelay         on;\n    keepalive_timeout   65;\n    types_hash_max_size
      4096;\n\n    include             /etc/nginx/mime.types;\n    default_type        application/octet-stream;\n
      \   types {\n        application/manifest+json webmanifest;\n    }\n\n\n    #
      Load modular configuration files from the /etc/nginx/conf.d directory.\n    #
      See http://nginx.org/en/docs/ngx_core_module.html#include\n    # for more information.\n
      \   include /etc/nginx/conf.d/*.conf;\n\n    upstream uwsgi {\n        server
