      \   service_type: gateway\n  - name: controller\n    service_type: controller\n
      \ - name: hub\n    service_type: hub\n  - name: eda\n    service_type: eda\ngateway_service_nodes:\n
      \ - name: \"Node gateway\"\n    service_cluster: gateway\n    address: '0.0.0.0'\n
      \ - name: \"Node controller - myaap-controller\"\n    service_cluster: controller\n
      \   address: \"myaap-controller-service\"\n  - name: \"Node galaxy - myaap-hub\"\n
      \   service_cluster: hub\n    address: \"myaap-hub-web-svc\"\n  - name: \"Node
      eda - myaap-eda\"\n    service_cluster: eda\n    address: \"myaap-eda-api\"\n
      \   tags: \"eda\"\n  - name: \"Node eda event stream - myaap-eda\"\n    service_cluster:
      eda\n    address: \"myaap-eda-event-stream\"\n    tags: \"eda-event-stream\"\ngateway_services:\n
      \ - name: \"gateway api\"\n    api_slug: gateway\n    http_port: port-8000\n
