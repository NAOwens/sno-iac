- apiVersion: v1
  data:
    galaxy_ng.conf: "location /ui/ {\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n
      \   proxy_set_header X-Forwarded-Proto $trusted_proto;\n    proxy_set_header
      Host $http_host;\n    rewrite /ui* /static/galaxy_ng/index.html break;\n    #
      we don't want nginx trying to do something clever with\n    # redirects, we
      set the Host: header above already.\n    proxy_redirect off;\n    proxy_pass
      http://pulp-api/static/galaxy_ng/index.html;\n}\n\nlocation /api/ {\n    proxy_set_header
      X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto
      $trusted_proto;\n    proxy_set_header Host $http_host;\n    # we don't want
      nginx trying to do something clever with\n    # redirects, we set the Host:
      header above already.\n    proxy_redirect off;\n    proxy_pass http://pulp-api;\n
      \   client_max_body_size 0;\n}\n"
    nginx.conf: "error_log /dev/stderr warn;\nworker_processes 1;\nevents {\n    worker_connections
      1024;  # increase if you have lots of clients\n    accept_mutex off;  # set
      to 'on' if nginx worker_processes > 1\n}\n\nhttp {\n    map $http_x_forwarded_proto
      $trusted_proto {\n        default $scheme;\n        https   https;\n        http
      \   http;\n    }\n\n    map $http_x_trusted_proxy $trusted_proxy_present {\n
      \       default \"trusted-proxy\";\n        \"\"      \"-\";\n    }\n\n    map
      $http_x_dab_jw_token $dab_jwt_present {\n        default \"dab-jwt\";\n        \"\"
      \     \"-\";\n    }\n\n    log_format main '$remote_addr - $remote_user [$time_local]
      \"$request\" '\n                    '$status $body_bytes_sent \"$http_referer\"
      '\n                    '\"$http_user_agent\" \"$http_x_forwarded_for\" '\n                    '$trusted_proxy_present
      $dab_jwt_present';\n\n    access_log /dev/stdout main;\n    include mime.types;\n
      \   # fallback in case we can't determine a type\n    default_type application/octet-stream;\n
      \   sendfile on;\n\n    # If left at the default of 1024, nginx emits a warning
      about being unable\n    # to build optimal hash types.\n    types_hash_max_size
      4096;\n\n    upstream pulp-content {\n        server myaap-hub-content-svc:24816;\n
      \   }\n\n    upstream pulp-api {\n        server myaap-hub-api-svc:8000;\n    }\n\n
      \   \n    server {\n                # Gunicorn docs suggest the use of the \"deferred\"
      directive on Linux.\n        listen 8080 default_server deferred;\n        listen
      [::]:8080 default_server deferred;\n    \n        # If you have a domain name,
      this is where to add it\n        server_name $hostname;\n\n        proxy_read_timeout
      15s;\n        proxy_connect_timeout 15s;\n        proxy_send_timeout 15s;\n\n
      \       # The default client_max_body_size is 1m. Clients uploading\n        #
      files larger than this will need to chunk said files.\n        client_max_body_size
      10m;\n\n        # Gunicorn docs suggest this value.\n        keepalive_timeout
      5;\n\n        # static files that can change dynamically, or are needed for
      TLS\n        # purposes are served through the webserver.\n        root /opt/app-root/src;\n\n
      \       location /pulp/content/ {\n            proxy_set_header X-Forwarded-For
      $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto
      $trusted_proto;\n            proxy_set_header Host $http_host;\n            #
      we don't want nginx trying to do something clever with\n            # redirects,
      we set the Host: header above already.\n            proxy_redirect off;\n            proxy_pass
      http://pulp-content;\n            error_page 504 =503 /json_503;  # Return 503
      Service Unavailable with JSON response if gunicorn fails to respond\n            error_page
      502 =503 /json_503;  # Optional, in case gunicorn is completely down\n        }\n\n\n
      \       location = /json_503 {\n            # Custom JSON response for 503 Service
      Unavailable\n            internal;\n            add_header Content-Type application/json;\n\n
      \           # Check if X-Request-ID is set and include it in the response\n
      \           if ($http_x_request_id) {\n                return 503 '{\"status\":
      \"error\", \"message\": \"Service Unavailable\", \"code\": 503, \"request_id\":
      \"$http_x_request_id\"}';\n            }\n\n            # If X-Request-ID is
      not set, just return the basic JSON response\n            return 503 '{\"status\":
      \"error\", \"message\": \"Service Unavailable\", \"code\": 503}';\n        }\n\n
      \       location /api/galaxy/pulp/api/v3/ {\n            proxy_set_header X-Forwarded-For
      $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto
      $trusted_proto;\n            proxy_set_header Host $http_host;\n            #
      we don't want nginx trying to do something clever with\n            # redirects,
      we set the Host: header above already.\n            proxy_redirect off;\n            proxy_pass
      http://pulp-api;\n            error_page 504 =503 /json_503;  # Return 503 Service
      Unavailable with JSON response if gunicorn fails to respond\n            error_page
      502 =503 /json_503;  # Optional, in case gunicorn is completely down\n        }\n\n
      \       location /auth/login/ {\n            proxy_set_header X-Forwarded-For
      $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto
      $trusted_proto;\n            proxy_set_header Host $http_host;\n            #
      we don't want nginx trying to do something clever with\n            # redirects,
      we set the Host: header above already.\n            proxy_redirect off;\n            proxy_pass
      http://pulp-api;\n        }\n\n        include /etc/nginx/default.d/*.conf;\n\n
      \       location / {\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n
      \           proxy_set_header X-Forwarded-Proto $trusted_proto;\n            proxy_set_header
      Host $http_host;\n            # we don't want nginx trying to do something clever
      with\n            # redirects, we set the Host: header above already.\n            proxy_redirect
      off;\n            proxy_pass http://pulp-api;\n            # static files are
      served through whitenoise - http://whitenoise.evans.io/en/stable/\n        }\n
      \   }\n}\n"
    pulp_ansible.conf: "location /pulp_ansible/galaxy/ {\n    proxy_set_header X-Forwarded-For
      $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $trusted_proto;\n
      \   proxy_set_header Host $http_host;\n    # we don't want nginx trying to do
      something clever with\n    # redirects, we set the Host: header above already.\n
      \   proxy_redirect off;\n    proxy_pass http://pulp-api;\n}\n"
    pulp_container.conf: "location /v2/ {\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n
      \   proxy_set_header X-Forwarded-Proto $trusted_proto;\n    proxy_set_header
      Host $http_host;\n    # we don't want nginx trying to do something clever with\n
      \   # redirects, we set the Host: header above already.\n    proxy_redirect
      off;\n    proxy_pass http://pulp-api;\n    client_max_body_size 0;\n}\n\nlocation
      /extensions/v2/ {\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n
      \   proxy_set_header X-Forwarded-Proto $trusted_proto;\n    proxy_set_header
      Host $http_host;\n    # we don't want nginx trying to do something clever with\n
      \   # redirects, we set the Host: header above already.\n    proxy_redirect
      off;\n    proxy_pass http://pulp-api;\n}\n\nlocation /pulp/container/ {\n    proxy_set_header
      X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto
      $trusted_proto;\n    proxy_set_header Host $http_host;\n    # we don't want
      nginx trying to do something clever with\n    # redirects, we set the Host:
      header above already.\n    proxy_redirect off;\n    proxy_pass http://pulp-content;\n}\n\nlocation
      /token/ {\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n
      \   proxy_set_header X-Forwarded-Proto $trusted_proto;\n    proxy_set_header
      Host $http_host;\n    # we don't want nginx trying to do something clever with\n
      \   # redirects, we set the Host: header above already.\n    proxy_redirect
      off;\n    proxy_pass http://pulp-api;\n}\n"
