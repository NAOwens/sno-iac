    settings: "# Downstream variables\nINSIGHTS_URL_BASE = 'https://cloud.redhat.com'\nREDHAT_CANDLEPIN_HOST
      = 'https://subscription.rhsm.redhat.com'\nREDHAT_CANDLEPIN_VERIFY = '/etc/rhsm/ca/redhat-uep.pem'\nREDHAT_CONTENT_URL
      = 'https://cdn.redhat.com'\nAUTOMATION_ANALYTICS_URL = 'https://cloud.redhat.com/api/ingress/v1/upload'\nSUBSCRIPTION_USAGE_MODEL
      = 'unique_managed_hosts'\nINSIGHTS_AGENT_MIME = 'application/vnd.redhat.tower.analytics+tgz'\n\nimport
      os\nimport socket\n# Import all so that extra_settings works properly\ntry:\n
      \   # Some AutomationController setups may have no django_auth_ldap dependency.\n
      \   from django_auth_ldap.config import *\nexcept:\n    pass\n\ndef get_secret():\n
      \   if os.path.exists(\"/etc/tower/SECRET_KEY\"):\n        return open('/etc/tower/SECRET_KEY',
      'rb').read().strip()\n\nADMINS = ()\nSTATIC_ROOT = '/var/lib/awx/public/static'\nSTATIC_URL
      = '/static/'\nPROJECTS_ROOT = '/var/lib/awx/projects'\nJOBOUTPUT_ROOT = '/var/lib/awx/job_status'\n\nIS_K8S
      = True\n\n\n\nSECRET_KEY = get_secret()\n\nALLOWED_HOSTS = ['*']\n\nINTERNAL_API_URL
      = 'http://127.0.0.1:8052'\n\nOPTIONAL_API_URLPATTERN_PREFIX = 'controller'\n\n#
      Container environments don't like chroots\nAWX_PROOT_ENABLED = False\n\n# Automatically
      deprovision pods that go offline\nAWX_AUTO_DEPROVISION_INSTANCES = True\n\nCLUSTER_HOST_ID
      = socket.gethostname()\nSYSTEM_UUID = os.environ.get('MY_POD_UID', '00000000-0000-0000-0000-000000000000')\n\nCSRF_COOKIE_SECURE
      = False\nSESSION_COOKIE_SECURE = False\n\nSERVER_EMAIL = 'root@localhost'\nDEFAULT_FROM_EMAIL
      = 'webmaster@localhost'\nEMAIL_SUBJECT_PREFIX = '[AutomationController] '\n\nEMAIL_HOST
      = 'localhost'\nEMAIL_PORT = 25\nEMAIL_HOST_USER = ''\nEMAIL_HOST_PASSWORD =
      ''\nEMAIL_USE_TLS = False\n\nUSE_X_FORWARDED_PORT = True\nBROADCAST_WEBSOCKET_PORT
      = 8052\nBROADCAST_WEBSOCKET_PROTOCOL = 'http'\n\n\nRECEPTOR_LOG_LEVEL = 'info'\n\n\nANSIBLE_BASE_JWT_KEY
      = \"http://myaap\"\nANSIBLE_BASE_JWT_REDIRECT_TYPE = \"awx\"\nENABLE_SERVICE_BACKED_SSO
      = False\nSERVICE_BACKED_SSO_AUTH_CODE_REDIRECT_URL = \"https://myaap-aap.apps.sno.ofam.dev\"\nRESOURCE_SERVER
      = {'SECRET_KEY': 'haAhpLP3gvECUG_j8Wc_obzrM6NLIpSgcnYsFwyKza0TAj6YoK2tGUj-lVkUPMwb9Lw1KNR_dZShuXD2IOWXMg',
      'URL': 'http://myaap', 'VALIDATE_HTTPS': 'False'}\nANSIBLE_BASE_MANAGED_ROLE_REGISTRY
      = {\"platform_auditor\": {\"name\": \"Platform Auditor\", \"shortname\": \"sys_auditor\"}}\nOPTIONAL_UI_URL_PREFIX
      = \"execution\"\n"
    uwsgi_conf: '[uwsgi]

      socket = 127.0.0.1:8050

      processes = 5

      listen = 128

      master = true

      vacuum = true

      no-orphans = true

      lazy-apps = true

      manage-script-name = true

      master-fifo = /var/lib/awx/awxfifo

      max-requests = 1000

      buffer-size = 32768


      harakiri = 10

      harakiri-graceful-timeout = 2

      harakiri-graceful-signal = 6

      py-call-osafterfork = true


      if-env = UWSGI_MOUNT_PATH

      mount = %(_)=awx.wsgi:application

      endif =


      if-not-env = UWSGI_MOUNT_PATH

      mount = /=awx.wsgi:application

      endif =

