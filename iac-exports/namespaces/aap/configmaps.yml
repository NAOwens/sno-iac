- apiVersion: v1
  data:
    environment: 'AWX_SKIP_MIGRATIONS=true

      '
    nginx_conf: "worker_processes  1;\nworker_cpu_affinity  auto;\npid        /tmp/nginx.pid;\n\nevents
      {\n    worker_connections 1024;\n}\n\nhttp {\n    include       /etc/nginx/mime.types;\n
      \   default_type  application/octet-stream;\n    server_tokens off;\n    client_max_body_size
      5M;\n\n    map $http_x_trusted_proxy $trusted_proxy_present {\n        default
      \"trusted-proxy\";\n        \"\"      \"-\";\n    }\n\n    map $http_x_dab_jw_token
      $dab_jwt_present {\n        default \"dab-jwt\";\n        \"\"      \"-\";\n
      \   }\n\n    log_format  main  '$remote_addr - $remote_user [$time_local] \"$request\"
      '\n                      '$status $body_bytes_sent \"$http_referer\" '\n                      '\"$http_user_agent\"
      \"$http_x_forwarded_for\" '\n                      '$trusted_proxy_present $dab_jwt_present';\n\n
      \   access_log /dev/stdout main;\n    error_log /dev/stderr warn;\n\n    map
      $http_upgrade $connection_upgrade {\n        default upgrade;\n        ''      close;\n
      \   }\n\n    sendfile        on;\n    #tcp_nopush     on;\n    #gzip  on;\n\n
      \   upstream uwsgi {\n        server 127.0.0.1:8050;\n    }\n\n    upstream
      daphne {\n        server 127.0.0.1:8051;\n    }\n\n\n    \n    server {\n                listen
      8052 default_server;\n                    listen [::]:8052 default_server;\n
      \               \n        # If you have a domain name, this is where to add
      it\n        server_name _;\n        keepalive_timeout 65;\n\n        # HSTS
      (ngx_http_headers_module is required) (15768000 seconds = 6 months)\n        add_header
      Strict-Transport-Security max-age=15768000;\n\n        # Protect against click-jacking
      https://www.owasp.org/index.php/Testing_for_Clickjacking_(OTG-CLIENT-009)\n
      \       add_header X-Frame-Options \"DENY\";\n        # Protect against MIME
      content sniffing https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options\n
      \       add_header X-Content-Type-Options nosniff;\n\n        location /nginx_status
      {\n            stub_status on;\n            access_log off;\n            allow
      127.0.0.1;\n            deny all;\n        }\n\n        location /static {\n
      \           alias /var/lib/awx/public/static/;\n        }\n\n        location
      /locales {\n            alias /var/lib/awx/public/static/awx/locales;\n        }\n\n
      \       location /favicon.ico {\n            alias /var/lib/awx/public/static/media/favicon.ico;\n
      \       }\n\n        location ~ ^(/websocket/|/api/websocket/|/api/controller/v2/websocket/)
      {\n            # Pass request to the upstream alias\n            proxy_pass
      http://daphne;\n            # Require http version 1.1 to allow for upgrade
      requests\n            proxy_http_version 1.1;\n            # We want proxy_buffering
      off for proxying to websockets.\n            proxy_buffering off;\n            #
      http://en.wikipedia.org/wiki/X-Forwarded-For\n            proxy_set_header X-Forwarded-For
      $proxy_add_x_forwarded_for;\n            # enable this if you use HTTPS:\n            proxy_set_header
      X-Forwarded-Proto https;\n            # pass the Host: header from the client
      for the sake of redirects\n            proxy_set_header Host $http_host;\n            #
      We've set the Host header, so we don't need Nginx to muddle\n            # about
      with redirects\n            proxy_redirect off;\n            # Depending on
      the request value, set the Upgrade and\n            # connection headers\n            proxy_set_header
      Upgrade $http_upgrade;\n            proxy_set_header Connection $connection_upgrade;\n
      \       }\n\n        location / {\n            # Add trailing / if missing\n
      \           rewrite ^(.*)$http_host(.*[^/])$ $1$http_host$2/ permanent;\n            uwsgi_read_timeout
      15s;\n            uwsgi_pass uwsgi;\n            include /etc/nginx/uwsgi_params;\n
      \           include /etc/nginx/conf.d/*.conf;\n            proxy_set_header
      X-Forwarded-Port 443;\n            uwsgi_param HTTP_X_FORWARDED_PORT 443;\n\n
      \           add_header Strict-Transport-Security max-age=15768000;\n            #
      Protect against click-jacking https://www.owasp.org/index.php/Testing_for_Clickjacking_(OTG-CLIENT-009)\n
      \           add_header X-Frame-Options \"DENY\";\n            add_header X-Content-Type-Options
      nosniff;\n            add_header Cache-Control \"no-cache, no-store, must-revalidate\";\n
      \           add_header Expires \"0\";\n            add_header Pragma \"no-cache\";\n
      \           # Return 503 Service Unavailable with JSON response if uWSGI fails
      to respond\n            error_page 504 =503 /json_503;\n            error_page
      502 =503 /json_503;  # Optional, in case uWSGI is completely down   \n        }\n\n
      \       location = /json_503 {\n            # Custom JSON response for 503 Service
      Unavailable\n            internal;\n            add_header Content-Type application/json;\n\n
      \           # Check if X-Request-ID is set and include it in the response\n
      \           if ($http_x_request_id) {\n                return 503 '{\"status\":
      \"error\", \"message\": \"Service Unavailable\", \"code\": 503, \"request_id\":
      \"$http_x_request_id\"}';\n            }\n\n            # If X-Request-ID is
      not set, just return the basic JSON response\n            return 503 '{\"status\":
      \"error\", \"message\": \"Service Unavailable\", \"code\": 503}';\n        }\n
      \   }\n}\n"
    receptor_conf: "---\n- log-level: info\n- local-only: null\n- node:\n   firewallrules:\n
      \   - action: reject\n      tonode: HOSTNAME\n      toservice: control\n- control-service:\n
      \   service: control\n    filename: /var/run/receptor/receptor.sock\n    permissions:
      '0660'\n- work-command:\n    worktype: local\n    command: ansible-runner\n
      \   params: worker\n    allowruntimeparams: true\n- work-kubernetes:\n    worktype:
      kubernetes-runtime-auth\n    authmethod: runtime\n    allowruntimeauth: true\n
      \   allowruntimepod: true\n    allowruntimeparams: true\n- work-kubernetes:\n
      \   worktype: kubernetes-incluster-auth\n    authmethod: incluster\n    allowruntimeauth:
      true\n    allowruntimepod: true\n    allowruntimeparams: true\n- tls-client:\n
      \   cert: /etc/receptor/tls/receptor.crt\n    key: /etc/receptor/tls/receptor.key\n
      \   name: tlsclient\n    rootcas: /etc/receptor/tls/ca/mesh-CA.crt\n    mintls13:
      false\n- work-signing:\n    privatekey: /etc/receptor/work_private_key.pem\n
      \   tokenexpiration: 1m\n"
    redis_conf: 'unixsocket /var/run/redis/redis.sock

      unixsocketperm 777

      port 0

      bind 127.0.0.1

      dir /var/lib/redis/data

      timeout 300

