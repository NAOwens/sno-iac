    nginx_default_conf_template: "events {\n    worker_connections 1024;\n}\nhttp
      {\n    map $http_x_forwarded_proto $remote_scheme {\n        default $http_x_forwarded_proto;\n
      \       ''      $scheme;\n    }\n\n    map $http_x_trusted_proxy $trusted_proxy_present
      {\n        default \"trusted-proxy\";\n        \"\"      \"-\";\n    }\n\n    map
      $http_x_dab_jw_token $dab_jwt_present {\n        default \"dab-jwt\";\n        \"\"
      \     \"-\";\n    }\n\n    log_format main '$remote_addr - $remote_user [$time_local]
      \"$request\" '\n                    '$status $body_bytes_sent \"$http_referer\"
      '\n                    '\"$http_user_agent\" \"$http_x_forwarded_for\" '\n                    'rid=$request_id
      $trusted_proxy_present $dab_jwt_present';\n\n    access_log /dev/stdout main;\n
      \   error_log /dev/stderr warn;\n\n    include mime.types;\n    types {\n        application/manifest+json
      webmanifest;\n    }\n\n    server {\n        listen 8080;\n                    listen
      [::]:8080;\n        \n        server_name _;\n        server_tokens off;\n\n
      \       autoindex off;\n\n        include mime.types;\n        types {\n            application/manifest+json
      webmanifest;\n        }\n\n        sendfile on;\n\n        root /var/lib/ansible-automation-platform/eda/ui;\n\n
      \       location ~ ^/api/eda {\n            proxy_pass http://myaap-eda-api:8000;\n
      \           proxy_set_header Origin http://myaap-eda-api:8000;\n            proxy_set_header
      Host $http_host;\n            proxy_set_header X-Forwarded-Proto $remote_scheme;\n
      \           proxy_set_header X-Forwarded-Port $server_port;\n            proxy_set_header
      X-Forwarded-For $proxy_add_x_forwarded_for;\n            # Return 503 Service
      Unavailable with JSON response if gunicorn fails to respond\n            proxy_read_timeout
      15s;\n            error_page 504 =503 /json_503;\n            error_page 502
      =503 /json_503;  # Optional, in case gunicorn is completely down    \n        }\n\n
      \       location ~* \\.(json|woff|woff2|jpe?g|png|gif|ico|svg|css|js)$ {\n            add_header
      Cache-Control \"public, max-age=31536000, s-maxage=31536000, immutable\";\n
      \           try_files $uri =404;\n            gzip_static on;\n        }\n\n
      \       location / {\n            autoindex off;\n            expires off;\n
      \           add_header Cache-Control \"public, max-age=0, s-maxage=0, must-revalidate\"
      always;\n            try_files $uri $uri/ /index.html =404;\n        }\n        location
      = /json_503 {\n          # Custom JSON response for 503 Service Unavailable\n
      \         internal;\n          add_header Content-Type application/json;\n\n
      \         # Check if X-Request-ID is set and include it in the response\n          if
      ($http_x_request_id) {\n              return 503 '{\"status\": \"error\", \"message\":
      \"Service Unavailable\", \"code\": 503, \"request_id\": \"$http_x_request_id\"}';\n
      \         }\n\n          # If X-Request-ID is not set, just return the basic
      JSON response\n          return 503 '{\"status\": \"error\", \"message\": \"Service
      Unavailable\", \"code\": 503}';\n      }   \n    }\n  }\n"
