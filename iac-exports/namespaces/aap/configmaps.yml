- apiVersion: v1
  data:
    init_component_dbs.sh: "db_exists=$(psql -tAc \"SELECT 1 FROM pg_database WHERE
      datname='gateway'\")\nuser_exists=$(psql -tAc \"SELECT 1 FROM pg_roles WHERE
      rolname='gateway'\")\n\nif [ -z \"$user_exists\" ]; then\n    psql -c \"CREATE
      USER gateway WITH ENCRYPTED PASSWORD 'gitU6mZ3t1LvZpLVoeeEztCJWORd21Uf';\"\n
      \   psql -c \"GRANT USAGE, CREATE ON SCHEMA public TO gateway\"\nfi\n\nif [
      -z \"$db_exists\" ]; then\n    psql -c \"CREATE DATABASE gateway WITH OWNER
      gateway;\"\nfi\n\ndb_exists=$(psql -tAc \"SELECT 1 FROM pg_database WHERE datname='automationcontroller'\")\nuser_exists=$(psql
      -tAc \"SELECT 1 FROM pg_roles WHERE rolname='automationcontroller'\")\n\nif
      [ -z \"$user_exists\" ]; then\n    psql -c \"CREATE USER automationcontroller
      WITH ENCRYPTED PASSWORD 'xJVJZLHDjHUGQgFohnBoawYFQiyoTFSp';\"\n    psql -c \"GRANT
      USAGE, CREATE ON SCHEMA public TO automationcontroller\"\nfi\n\nif [ -z \"$db_exists\"
      ]; then\n    psql -c \"CREATE DATABASE automationcontroller WITH OWNER automationcontroller;\"\nfi\n\ndb_exists=$(psql
      -tAc \"SELECT 1 FROM pg_database WHERE datname='automationhub'\")\nuser_exists=$(psql
      -tAc \"SELECT 1 FROM pg_roles WHERE rolname='automationhub'\")\n\nif [ -z \"$user_exists\"
      ]; then\n    psql -c \"CREATE USER automationhub WITH ENCRYPTED PASSWORD 'cNGhKQMQR7P8N7fUwe2YHhOSQ4F2RITW';\"\n
      \   psql -c \"GRANT USAGE, CREATE ON SCHEMA public TO automationhub\"\nfi\n\nif
      [ -z \"$db_exists\" ]; then\n    psql -c \"CREATE DATABASE automationhub WITH
      OWNER automationhub\"\nfi\n\ndb_exists=$(psql -tAc \"SELECT 1 FROM pg_database
      WHERE datname='eda'\")\nuser_exists=$(psql -tAc \"SELECT 1 FROM pg_roles WHERE
      rolname='eda'\")\n\nif [ -z \"$user_exists\" ]; then\n    psql -c \"CREATE USER
      eda WITH ENCRYPTED PASSWORD 'MsejixQa641FkkC620SK7p3AULjRwSid';\"\n    psql
      -c \"GRANT USAGE, CREATE ON SCHEMA public TO eda\"\nfi\n\nif [ -z \"$db_exists\"
      ]; then\n    psql -c \"CREATE DATABASE eda WITH OWNER eda;\"\nfi\n\n\n# Check
      and refresh collation version for databases that need it\n# This addresses collation
      version changes from 2.28 to 2.34 when upgrading from RHEL8 to RHEL9\necho \"Checking
      databases for collation version refresh...\"\n\n# Function to check if a database
      needs collation refresh\ncheck_and_refresh_collation() {\n    local db_name=\"$1\"\n
      \   local needs_refresh\n\n    # Check if database exists first\n    if ! psql
      -tAc \"SELECT 1 FROM pg_database WHERE datname='$db_name'\" | grep -q 1; then\n
      \       echo \"Database $db_name does not exist, skipping collation check\"\n
      \       return 0\n    fi\n\n    # Check if collation refresh is needed by looking
      for version mismatches\n    # This query checks if there are any collations
      with version mismatches\n    needs_refresh=$(psql -d \"$db_name\" -tAc \"\n
      \       SELECT COUNT(*)\n        FROM pg_collation\n        WHERE collversion
      IS NOT NULL\n        AND collversion != pg_collation_actual_version(oid);\"
      2>/dev/null || echo \"0\")\n\n    if [ \"$needs_refresh\" -gt 0 ]; then\n        echo
      \"Database $db_name needs collation version refresh ($needs_refresh mismatched
      collations)\"\n        if psql -d \"$db_name\" -c \"ALTER DATABASE $db_name
      REFRESH COLLATION VERSION;\" 2>/dev/null; then\n            echo \"Successfully
      refreshed collation version for $db_name\"\n        else\n            echo \"Warning:
      Failed to refresh collation version for $db_name\"\n        fi\n    else\n        echo
      \"Database $db_name collation version is up to date\"\n    fi\n}\n\n# Check
      and refresh system databases\ncheck_and_refresh_collation \"template1\"\ncheck_and_refresh_collation
      \"postgres\"\n\n# Check and refresh gateway database\ngateway_db_name=\"gateway\"\ncheck_and_refresh_collation
      \"$gateway_db_name\"\n\n# Check and refresh controller database\ncontroller_db_name=\"automationcontroller\"\ncheck_and_refresh_collation
      \"$controller_db_name\"\n\n# Check and refresh hub database\nhub_db_name=\"automationhub\"\ncheck_and_refresh_collation
      \"$hub_db_name\"\n\n# Check and refresh eda database\neda_db_name=\"eda\"\ncheck_and_refresh_collation
      \"$eda_db_name\"\n\n\necho \"Collation version check and refresh completed.\"\n"
