        = ''''\n\nCACHES[''fallback''][''LOCATION''] = ''/var/cache/ansible-automation-platform/gateway''\n\nCSRF_TRUSTED_ORIGINS
        = [''https://myaap-aap.apps.sno.ofam.dev'']\n\n\n###############################################################################\n#
        !!!!!!!!!!!! CAUTION !!!!!!!!!!!\n#\n# This file may be managed by an installer
