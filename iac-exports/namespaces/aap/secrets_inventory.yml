        there is 1 hop between envoy\n# and the edge proxy.\nXDS_XFF_NUM_TRUSTED_HOPS
        = 1\n\nFRONT_END_URL = ''https://myaap-aap.apps.sno.ofam.dev''\n\n# Feature
        flags\n\n# Redis settings\n\nREDIS_USER = ''gateway''\nREDIS_PASS = ''ioE1PF5EVU5yCOCDq6SOe9iMVHvAHJxv''\nREDIS_HOST
        = ''myaap-redis-svc''\nREDIS_PORT = ''6379''\n\nCACHES[\"primary\"][''LOCATION'']
        = ''redis://'' + REDIS_USER + '':'' + REDIS_PASS + ''@'' + REDIS_HOST.split('','')[0]
        + '':'' + REDIS_PORT\nCACHES[\"primary\"][\"OPTIONS\"][\"CLIENT_CLASS_KWARGS\"][''ssl'']
        = False\nCACHES[\"primary\"][\"OPTIONS\"][\"CLIENT_CLASS_KWARGS\"][''mode'']
